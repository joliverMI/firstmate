# Per-repo no-mistakes overrides.

# This repo is a real GitHub fork (joliverMI/firstmate, forked from the public
# kunchenguid/firstmate). There is no key in this file, or anywhere else
# no-mistakes reads, that points its PR step's destination at this repo
# instead of the fork parent: `no-mistakes init --fork-url` solves the
# opposite workflow (push to a fork, PR against the recorded origin) and does
# not apply here. The fix is bin/fm-pr-destination-guard.sh, applied outside
# this file's reach; see docs/architecture.md "Pull request destination is
# pinned, never gh's default" before assuming a key here can solve this again.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI invokes instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the context-sensitive ShellCheck modes and GitHub
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# Invocation wiring is asserted by `tests/fm-lint.test.sh` and
# `tests/fm-lint-workflows.test.sh`.
#
# Keep commands.test absent; the firstmate-coding-guidelines skill owns this policy.
commands:
  lint: 'bin/fm-lint.sh'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  evidence:
    store_in_repo: true

# Info-severity review findings catch far fewer real bugs than error/warning
# ones but still cost a fix-and-rereview round when selected, so keep them
# visible without letting them spend tokens. There is no native severity knob
# for auto_fix selection (v1.84), so this is the documented review-instruction
# workaround: `path: "*"` is a no-slash pattern, which matches every changed
# file by basename at any depth (see docs/reference/repo-config.md
# "ignore_patterns" for that matcher), so this block always applies.
review:
  path_instructions:
    - path: "*"
      instructions: |
        Classify every info-severity finding's action as no-op, never
        auto-fix or ask-user. Keep reporting info-severity findings in the
        findings table so they stay visible - only their action
        classification changes. Do not fold an info-severity finding into a
        fix round or let it trigger another review pass on its own. This
        does not relax error- or warning-severity findings, which keep
        their ordinary action and escalation path.
